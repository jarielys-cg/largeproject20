services:
  - type: web
    name: bizmart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_USER
        sync: false
      - key: MONGO_PASS
        sync: false
      - key: MONGO_CLUSTER
        sync: false
      - key: MONGO_DB
        sync: false
      - key: JWT_SECRET
        sync: false
